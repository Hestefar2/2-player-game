<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Banners of War">
<meta name="theme-color" content="#1f2a12">
<title>Banners of War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#efe0bb; --parch2:#dcc690; --ink:#2b1d0e; --ink2:#5d4526; --edge:#6a4a22; --gold:#a8761a;
  --btn:#7e2618; --btnInk:#fff3d6; --shade:rgba(24,16,7,.74); --hudInk:#f4e8cc;
  --head:'Cinzel','Palatino Linotype','Book Antiqua',Georgia,serif;
  --body:'Alegreya Sans','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --parch:#e4d3a9; --parch2:#cdb57e; --shade:rgba(14,9,4,.8); }
}
:root[data-theme="dark"]{ --parch:#e4d3a9; --parch2:#cdb57e; --shade:rgba(14,9,4,.8); }
*,*::before,*::after{box-sizing:inherit}
html{touch-action:manipulation;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:#1f2a12;color:var(--ink);font-family:var(--body);overflow:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;left:0;top:0;display:block;touch-action:none}
button{font-family:inherit}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:none;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);pointer-events:none}
#hud.on{display:flex}
.pside{width:24vw;min-width:124px;max-width:230px;background:var(--shade);border:1px solid rgba(240,224,187,.22);border-radius:8px;padding:5px 9px 6px;color:var(--hudInk)}
.pname{font-family:var(--head);font-weight:800;font-size:12px;letter-spacing:.04em;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.pside.r .pname{justify-content:flex-end}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
.bar{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:2px}
.pside.r .bar{flex-direction:row-reverse}
.bar span{width:40px;opacity:.85}
.pside.r .bar span{text-align:right}
.track{flex:1;height:7px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden;display:flex}
.pside.r .track{justify-content:flex-end}
.track i{display:block;height:100%;width:100%;background:var(--c)}
.track.locked i{opacity:.4;background:repeating-linear-gradient(135deg,var(--c) 0 4px,rgba(255,255,255,.35) 4px 6px)}
.mid{flex:1;max-width:38vw;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto}
.clocks{display:flex;gap:6px}
.timer{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{color:#ffcf6b}
.clock{font-family:var(--head);font-weight:800;font-size:13px;color:var(--hudInk);background:var(--shade);border-radius:8px;padding:3px 12px;white-space:nowrap}
#mini{width:100%;height:24px;border-radius:5px;border:1px solid rgba(240,224,187,.4);touch-action:none;display:block}
body.battling #hud{top:auto;bottom:0;align-items:flex-end;
  padding:0 calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 10px)}
body.battling .mid{flex-direction:column-reverse}

/* Shop */
#shop{position:fixed;left:0;right:0;bottom:0;z-index:7;display:none;
  padding:0 calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 10px)}
#shop.on{display:block}
#shop{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#shop.collapsed{transform:translateY(calc(100% - 30px - env(safe-area-inset-bottom,0px)))}
#shopTab{display:flex;align-items:center;gap:7px;margin:0 auto -2px;position:relative;z-index:1;height:28px;padding:0 16px;
  border:2px solid var(--edge);border-bottom:none;border-radius:10px 10px 0 0;background:linear-gradient(var(--parch),var(--parch2));
  font-family:var(--head);font-weight:800;font-size:12px;color:var(--ink);cursor:pointer;touch-action:manipulation;box-shadow:0 -3px 10px rgba(0,0,0,.3)}
#shopTab .arw{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--ink2);transition:transform .3s}
#shop.collapsed #shopTab .arw{transform:rotate(180deg)}
#shop.collapsed #shopTab{box-shadow:0 -3px 12px rgba(0,0,0,.45),0 0 0 2px rgba(242,193,78,.5)}
.shopbox{background:linear-gradient(var(--parch),var(--parch2));border:2px solid var(--edge);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.35);
  padding:9px 10px;display:flex;gap:10px;align-items:stretch}
.shopinfo{display:flex;flex-direction:column;justify-content:center;min-width:112px;max-width:150px}
.who{font-family:var(--head);font-weight:800;font-size:14px;color:var(--c);line-height:1.15}
.goldline{font-weight:800;font-size:22px;display:flex;align-items:center;gap:6px;margin:2px 0}
.coins{width:1.05em;height:1.05em;flex:none;vertical-align:-.18em}
.hint{font-size:11.5px;color:var(--ink2);line-height:1.25}
.cards{display:flex;gap:9px;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;padding:10px 10px 4px;margin:-10px -4px -4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.grp{flex:none;display:flex;flex-direction:column;gap:2px}
.grp + .grp{border-left:1.5px dashed rgba(106,74,34,.35);padding-left:10px}
.grp h4{margin:0;font-family:var(--head);font-weight:800;font-size:11px;letter-spacing:.03em;color:var(--ink2)}
.grp.lg h4{color:#8a5a08}
.grp.lg.locked h4{color:var(--ink2)}
.grp.lg.locked .card{filter:grayscale(1);opacity:.5;box-shadow:none;border-style:dashed;cursor:not-allowed}
.ct{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%;flex:1}
#playBtn.legend{background:linear-gradient(#ffe38a,#e9b331 60%,#c98d18);color:#3a2404;
  border:3px double #7a4f08;box-shadow:0 0 0 2px #fff1b8,0 0 18px rgba(255,200,60,.85),inset 0 -3px 0 rgba(120,70,0,.3)}
#playBtn.legend .tri{border-left-color:#3a2404}
.grp .row{display:flex;gap:9px;padding-top:8px}
.card.leg{border:2px solid #b8862a;background:linear-gradient(#fff4d2,#f1d78e);box-shadow:inset 0 0 0 2px #fff6d8,inset 0 0 0 3px #b8862a,0 0 10px rgba(242,190,60,.75)}
.card.leg .cn{color:#6b3f06}
.card.met{border-color:#8a2a14;background:linear-gradient(rgba(255,236,220,.6),rgba(240,190,160,.45))}
.legnote{font-family:var(--head);font-weight:800;color:#8a5a08;margin:-4px 0 12px;text-shadow:0 0 8px rgba(255,210,90,.8)}
.card{position:relative;flex:0 0 100px;min-width:0;border:1.5px solid var(--edge);border-radius:9px;background:rgba(255,250,235,.42);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 3px 6px;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.card:active{transform:scale(.96)}
.card.dis{opacity:.42}
.card.no{animation:no .25s}
@keyframes no{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card canvas{width:50px;height:42px;display:block}
.cn{font-family:var(--head);font-weight:600;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cd{font-size:10.5px;line-height:1.2;color:var(--ink2);text-align:center;margin:1px 0 3px}
.cc{margin-top:auto;display:flex;align-items:center;gap:3px;font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap}
.cnt{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--c);color:#fff;font-weight:800;font-size:13px;
  display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.minus{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:13px;border:1.5px solid var(--edge);background:var(--parch);
  font-weight:800;font-size:16px;line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
.z{display:none!important}
.shopbtns{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:104px}
.minus.x{font-size:17px;background:#fff3e6;border-color:#8a2a14;color:#8a2a14}
.btn{font-family:var(--head);font-weight:800;border:none;border-radius:9px;background:var(--btn);color:var(--btnInk);padding:11px 16px;font-size:14px;letter-spacing:.03em;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.card:focus-visible,.minus:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink2);box-shadow:none;border:1.5px solid var(--edge);padding:7px 10px;font-size:12px}

/* Screens */
#screen{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(20,14,6,.45),rgba(10,7,3,.86));
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 16px)}
#screen.on{display:flex}
.panel{background:linear-gradient(var(--parch),var(--parch2));border:2px solid var(--edge);border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.35);padding:16px 24px 18px;max-width:660px;width:100%;max-height:100%;overflow:auto;text-align:center}
.panel h1{font-family:var(--head);font-weight:800;margin:0 0 4px;font-size:clamp(24px,5vh,34px);line-height:1.1;letter-spacing:.02em}
.panel .sub{color:var(--ink2);margin:0 auto 10px;font-size:15px;line-height:1.35;max-width:52ch}
.panel .rnd{font-family:var(--head);font-weight:600;color:var(--ink2);font-size:14px;margin-bottom:2px}
.units{display:flex;justify-content:center;gap:14px;margin:6px 0 12px;flex-wrap:wrap}
.units div{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink2)}
.units canvas{width:50px;height:42px}
.units b{font-family:var(--head);color:var(--ink);font-size:12px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;text-align:left;font-size:13.5px;line-height:1.35;margin:4px 0 10px}
.rules p{margin:0}
.big{font-size:17px;padding:13px 26px}
.tiny{font-size:12px;color:var(--ink2);margin:10px 0 0}
.goldbig{font-size:20px;font-weight:800;margin:4px 0 12px;display:flex;justify-content:center;align-items:center;gap:8px}
.goldbig small{font-size:13px;font-weight:700;color:var(--ink2)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

#ready{position:relative;overflow:hidden;-webkit-touch-callout:none;touch-action:none}
#ready .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,215,110,.55);pointer-events:none}
#ready.holding .fill{width:100%;transition:width 1s linear}
#ready .lbl{position:relative}
#playBtn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18%);transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:12px;
  font-size:20px;padding:16px 30px 16px 24px;border-radius:40px;animation:pulse 1.6s ease-in-out infinite}
#playBtn.on{display:flex}
#playBtn .tri{width:0;height:0;border-left:16px solid var(--btnInk);border-top:10px solid transparent;border-bottom:10px solid transparent}
@keyframes pulse{0%,100%{box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),0 0 0 0 rgba(242,193,78,.6)}50%{box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),0 0 0 12px rgba(242,193,78,0)}}
@media (prefers-reduced-motion:reduce){#playBtn{animation:none}}
.statwrap{overflow-x:auto;margin:0 auto 12px;max-width:520px}
.stats{width:100%;border-collapse:collapse;font-size:13.5px;text-align:center}
.stats th,.stats td{padding:4px 8px;border-bottom:1px solid rgba(106,74,34,.22)}
.stats thead th{font-family:var(--head);font-weight:800;font-size:13px;border-bottom:2px solid rgba(106,74,34,.45)}
.stats tbody th{text-align:left;font-weight:700;color:var(--ink2)}
.stats td{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats td.best{color:#8a5a08;background:rgba(242,193,78,.28)}
#banner{position:fixed;left:50%;top:44%;z-index:8;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;color:#fff6de;
  text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px rgba(0,0,0,.6)}
#banner.show{animation:bn 2.8s ease forwards}
#banner .bt{font-family:var(--head);font-weight:800;font-size:clamp(26px,7vh,44px);white-space:nowrap}
#banner .bs{font-size:15px;font-weight:700;margin-top:2px}
#banner.gold.show{animation-duration:3.6s}
#banner.gold .bt{font-size:clamp(28.6px,7.7vh,48.4px)}
#banner.gold .bs{font-size:16.5px}
#banner .gamt{color:#ffd772;white-space:nowrap}
#banner .gamt .coins{width:1.15em;height:1.15em;vertical-align:-.22em;margin-right:3px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-38%) scale(.94)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0}}

#rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1b1610;color:var(--hudInk);text-align:center;padding:24px}
#rotate h2{font-family:var(--head);margin:0;font-size:22px}
#rotate p{margin:0;opacity:.8}
.phone{width:44px;height:74px;border:3px solid var(--hudInk);border-radius:9px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){
  .pside{width:31vw;min-width:0;padding:4px 7px 5px}
  .pname{font-size:11px}
  .bar{font-size:10px;gap:4px}
  .bar span{width:34px}
  .mid{max-width:32vw}
  .clock{font-size:12px;padding:3px 8px}
  .shopbox{flex-direction:column;gap:12px;padding:12px}
  .shopinfo{max-width:none;flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:12px}
  .shopinfo .hint{flex-basis:100%}
  .shopbox{max-height:calc(100vh - 96px);overflow-y:auto}
  .cards{display:flex;flex-direction:column;gap:6px;overflow:visible;max-height:none;padding:8px 6px 2px;margin:-8px -6px -2px}
  .grp + .grp{border-left:none;padding-left:0;border-top:1.5px dashed rgba(106,74,34,.35);padding-top:6px}
  .grp .row{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-top:5px}
  .grp h4{font-size:11px}
  .card{flex:none;flex-direction:row;justify-content:flex-start;align-items:center;gap:6px;padding:5px 8px 5px 4px;min-height:52px}
  .card canvas{width:40px;height:34px;flex:none}
  .ct{align-items:flex-start}
  .cn{font-size:12.5px}
  .cd{font-size:10.5px;text-align:left;margin:0;line-height:1.2}
  .cc{margin-top:2px;font-size:12px}
  .shopbtns{flex-direction:row-reverse;flex-wrap:wrap}
      .shopbtns .btn{flex:1}
  .shopbtns .btn.ghost{flex:0 0 auto;padding:11px 16px}
  .rules{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.phone{animation:none;transform:rotate(-90deg)}#banner.show{animation-duration:2.8s}}
 @media (orientation:landscape) and (max-height:500px){
  #hud{gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 4px)}
  .pside{width:21vw;min-width:0;max-width:190px;padding:3px 7px 4px;border-radius:7px}
  .pname{font-size:10px;margin-bottom:0;gap:5px}
  .dot{width:7px;height:7px}
  .bar{font-size:9.5px;margin-top:1px;gap:4px}
  .bar span{width:30px}
  .track{height:5px}
  .mid{max-width:32vw;gap:3px}
  .clocks{gap:4px}
  .clock{font-size:11px;padding:2px 8px;border-radius:6px}
  .timer{min-width:46px}
  #mini{height:17px}
  body.battling #hud{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 3px)}
  #shop{padding:0}
  body.barmode #hud{display:none}
  .shopbox{display:grid;grid-template-columns:128px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:10px;row-gap:6px;
    padding:7px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 12px);
    border-radius:0;border-left:none;border-right:none;border-bottom:none;box-shadow:0 -4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4)}
  .shopinfo{grid-column:1;grid-row:1;min-width:0;max-width:none}
  .shopinfo .hint{display:none}
  .who{font-size:12px}
  .goldline{font-size:18px;margin:0}
  .shopbtns{grid-column:1;grid-row:2;min-width:0;gap:5px;justify-content:flex-start}
  .shopbtns .btn{padding:7px 10px;font-size:13px}
  .shopbtns .btn.ghost{padding:4px 8px;font-size:11px}
        .cards{grid-column:2;grid-row:1 / span 2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:10px;row-gap:3px;
    overflow:visible;padding:0;margin:0;align-content:start}
  .grp{min-width:0}
  .grp.bs,.grp.sp{grid-column:span 2}
  .grp.lg{grid-column:span 4}
  .grp + .grp{border-left:none;padding-left:0}
  .grp.sp{border-left:1.5px dashed rgba(106,74,34,.35);padding-left:9px;margin-left:-5px}
  .grp h4{font-size:10px}
  .grp .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding-top:4px}
  .grp.lg .row{grid-template-columns:repeat(4,minmax(0,1fr))}
  .card{flex:none;flex-direction:row;justify-content:flex-start;align-items:center;gap:5px;padding:3px 6px 3px 3px;min-height:44px}
  .card canvas{width:34px;height:29px;flex:none}
  .ct{align-items:flex-start}
  .cn{font-size:11px}
  .cd{font-size:9.5px;text-align:left;margin:0;line-height:1.15}
  .cc{margin-top:1px;font-size:11.5px}
  .cnt{top:-7px;right:-7px;min-width:20px;height:20px;font-size:11px;padding:0 5px}
  .minus{top:-7px;left:-7px;width:22px;height:22px;font-size:14px}
  #playBtn{font-size:17px;padding:11px 24px 11px 18px;bottom:calc(env(safe-area-inset-bottom,0px) + 14%)}
}
@media (max-height:360px){.panel{padding:10px 18px 12px}.rules{font-size:12.5px}.units{margin:2px 0 8px}}

/* ===== Shop dock: same docked design in landscape and portrait, equal-size cards ===== */
#shop{padding:0!important}
.shopbox{display:grid;gap:6px 12px;border:none;border-top:2px solid var(--edge);border-radius:0;
  box-shadow:0 -4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4);
  padding:8px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 12px);
  max-height:calc(100vh - 110px);overflow-y:auto;overflow-x:hidden}
.shopinfo{min-width:0;max-width:none}
.shopinfo .hint{display:none}
.cards{display:grid;overflow:visible;padding:0;margin:0;gap:4px 10px;align-content:start;min-width:0;max-height:none}
.grp,.grp .row{min-width:0}
.grp{display:flex;flex-direction:column;gap:0;padding:0!important;border:none!important;margin:0!important;position:relative}
.grp h4{font-size:10.5px;margin:0}
.grp .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:6px}
.card{flex:none;width:auto;height:56px;min-height:0;flex-direction:row;justify-content:flex-start;align-items:center;gap:6px;padding:4px 8px 4px 4px}
.card canvas{width:38px;height:32px;flex:none}
.ct{align-items:flex-start;justify-content:center;flex:1;min-width:0}
.cn{font-size:11.5px;line-height:1.15}
.cd{font-size:9.8px;line-height:1.15;text-align:left;margin:1px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc{margin-top:0;font-size:11.5px}
.cnt{top:-7px;right:-7px;min-width:20px;height:20px;font-size:11px;padding:0 5px}
.minus{top:-7px;left:-7px;width:22px;height:22px;font-size:14px}
@media (orientation:landscape){
  .shopbox{grid-template-columns:132px minmax(0,1fr);grid-template-rows:auto 1fr}
  .shopinfo{grid-column:1;grid-row:1;display:flex;flex-direction:column}
  .shopbtns{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:6px;justify-content:flex-start;min-width:0}
  .shopbtns .btn{padding:9px 12px;font-size:14px}
  .shopbtns .btn.ghost{padding:6px 10px;font-size:12px}
  .cards{grid-column:2;grid-row:1 / span 2;grid-template-columns:repeat(4,minmax(0,1fr))}
  .grp.bs,.grp.sp{grid-column:span 2}
  .grp.lg{grid-column:span 4}
  .grp.sp::before{content:'';position:absolute;left:-6px;top:2px;bottom:0;border-left:1.5px dashed rgba(106,74,34,.35)}
  .who{font-size:12.5px}
  .goldline{font-size:19px;margin:2px 0 0}
}
@media (orientation:portrait){
  .shopbox{grid-template-columns:minmax(0,1fr);max-height:calc(100vh - 150px)}
  .shopinfo{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .who{font-size:14px}
  .goldline{font-size:20px;margin:0}
  .cards{grid-template-columns:minmax(0,1fr);gap:6px}
  .grp + .grp{border-top:1.5px dashed rgba(106,74,34,.35)!important;padding-top:5px!important}
  .card{height:54px}
  .shopbtns{display:flex;flex-direction:row-reverse;gap:8px;min-width:0}
  .shopbtns .btn{flex:1;padding:11px 12px;font-size:15px}
  .shopbtns .btn.ghost{flex:0 0 auto;padding:11px 16px;font-size:13px}
}

  </div>
</div>

<div id="shop">

  <div class="shopbox">
    <div class="shopinfo">
      <div class="who" id="who">Player 1</div>
      <div class="goldline"><svg class="coins" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14v3a7 2.4 0 0 0 14 0v-3" fill="#c28a22" stroke="#6f4b0c" stroke-width=".8"/><ellipse cx="10" cy="14" rx="7" ry="2.4" fill="#f6ca58" stroke="#6f4b0c" stroke-width=".8"/><path d="M3 10v3a7 2.4 0 0 0 14 0v-3" fill="#c28a22" stroke="#6f4b0c" stroke-width=".8"/><ellipse cx="10" cy="10" rx="7" ry="2.4" fill="#f6ca58" stroke="#6f4b0c" stroke-width=".8"/><path d="M3 6v3a7 2.4 0 0 0 14 0v-3" fill="#c28a22" stroke="#6f4b0c" stroke-width=".8"/><ellipse cx="10" cy="6" rx="7" ry="2.4" fill="#f6ca58" stroke="#6f4b0c" stroke-width=".8"/></svg><span id="goldLeft">25</span></div>
      <div class="hint" id="shopHint">Tap a troop to recruit it</div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="shopbtns">
<button class="btn" id="ready" aria-label="Hold for one second to confirm"><span class="fill"></span><span class="lbl">Hold to ready</span></button>
      <button class="btn ghost" id="clear">Clear</button>
    </div>
  </div>
</div>

<button id="playBtn" class="btn" aria-label="Start the battle"><span class="tri"></span>Start battle</button>
<div id="screen"></div>
<div id="banner"></div>

<script>
(() => {
'use strict';
const W = 2250, H = 420, GT = 92, GB = 392, MIDY = 240;
const TOWER_OFF = Math.round(130 + (W - 260) / 3);   // castle, tower, tower, castle evenly spaced
const SIDES = [
  { name:'Player 1', tag:'Blue', col:'#2f6fd6', dark:'#1c4590', lite:'#a9c6f5', emblem:'circle' },
  { name:'Player 2', tag:'Red',  col:'#d23a2e', dark:'#8a2016', lite:'#f5b0a6', emblem:'stripes' }
];
const UT = {
  sword:   { name:'Swordsman',  role:'Melee',  cost:2,  hp:70, dmg:9,  range:10,  rate:0.9, speed:55, r:8,  sight:190, bld:1,   h:30 },
  archer:  { name:'Archer',     role:'Ranged', cost:3,  hp:40, dmg:9,  range:150, rate:1.3, speed:50, r:8,  sight:210, bld:0.6, h:30 },
  catapult:{ name:'Catapult',   role:'Siege',  cost:7,  hp:95, dmg:24, range:260, minRange:55, rate:3.6, speed:30, r:14, sight:290, bld:3, splash:38, h:34 },
  barrel:  { name:'Barrelman', role:'Blast',  cost:10, hp:50, dmg:70, range:4,   rate:0,   speed:72, r:8,  sight:230, bld:3, splash:64, h:32 }
};
Object.assign(UT, {
  priest:{ name:'Priest', role:'Healer',  cost:20,  hp:70,   heal:18, targets:2, range:110, rate:1.0, speed:48, r:8,  sight:230, bld:0,   h:34, legend:true },
  knight:{ name:'Knight', role:'Heavy armor', cost:40,  hp:720,  dmg:40,  range:12,  rate:.5, cleave:26, cleaveK:.1,  speed:52, r:10, sight:220, bld:.6,  h:40, legend:true },
  wizard:{ name:'Mage', role:'Magic',   cost:70,  hp:600, dmg:40,  range:200, rate:1.4, speed:44, r:9,  sight:240, bld:2.6, splash:48, h:42, legend:true },
  dragon:{ name:'Dragon', role:'Fire breath', cost:125, hp:850, dmg:68,  range:100, rate:.3,  speed:40, r:22, sight:280, bld:.6,  splash:40, splashK:.2, h:46, legend:true }
});
const TYPES = ['sword','archer','catapult','barrel'], LEGENDS = ['priest','knight','wizard','dragon'];
const AIR = new Set(['archer','wizard','dragon']);
const TOWER = { hp:1400, dmg:9.9, range:150, rate:1.1, r:26 };   // arrow tower
const CASTLE = { hp:2800, r:58 };
const INCOME0 = 20, INCOME_STEP = 2, BONUS = 15, BATTLE = 20, SPEED = 1.15;

const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const mini = $('#mini'), mctx = mini.getContext('2d');
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- Sound ---------- */
// Every sound is rendered once into a buffer when audio starts, then played back as a single source.
// This avoids building oscillators and filters on every hit (which can make iOS audio stutter and crackle),
// gives every sound a click-free fade in and out, and lets us cap how many copies of a sound overlap.
let AC = null, OUT = null, muted = false; const lastS = {}, SND = {}, VOICES = {};
const GAP = { towerShot:.1, fire:.18, magic:.1, heal:.2, clang:.07, twang:.09, thunk:.12, boom:.08, crumble:.3, horn:1, coin:.03, tap:.03 };
const LIMIT = { towerShot:3, clang:4, twang:4, thunk:3, boom:3, crumble:2, horn:1, coin:2, tap:2, fire:2, magic:3, heal:2 };
function envG(g, t, peak, a, dec){ g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dec); g.gain.linearRampToValueAtTime(0, t + a + dec + .02); }
function rNoise(c, out, t, dur, type, freq, peak, dec, q){
  const nb = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(); s.buffer = nb; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
  const g = c.createGain(); envG(g, t, peak, .004, dec); s.connect(f); f.connect(g); g.connect(out); s.start(t); }
function rTone(c, out, t, type, f0, f1, peak, dec, lp){
  const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dec);
  const g = c.createGain(); envG(g, t, peak, .006, dec); let n = o;
  if (lp){ const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); n = f; }
  n.connect(g); g.connect(out); o.start(t); o.stop(t + dec + .05); }
// [length in seconds, number of variations, recipe]
const RECIPES = {
  clang:  [.2, 3, (c, o) => { rNoise(c, o, 0, .12, 'bandpass', 3200, .05, .08, 6); rTone(c, o, 0, 'square', 1300 + Math.random() * 500, 900, .01, .08); }],   // original sword hit
  twang:  [.22, 3, (c, o) => { rTone(c, o, 0, 'triangle', 410 + Math.random() * 50, 160, .03, .13); rNoise(c, o, 0, .08, 'bandpass', 1800, .008, .06, 1.2); }],
  thunk:  [.32, 2, (c, o) => { rTone(c, o, 0, 'sine', 140, 55, .14, .22); rNoise(c, o, 0, .16, 'lowpass', 500, .07, .12); }],
  boom:   [1.45, 2, (c, o) => { rNoise(c, o, 0, 1.4, 'lowpass', 700, .4, .95); rTone(c, o, 0, 'sine', 90, 30, .3, .6); }],
  crumble:[1.95, 1, (c, o) => { rNoise(c, o, 0, 1.8, 'lowpass', 450, .35, 1.4); rNoise(c, o, .15, 1.4, 'bandpass', 900, .12, 1.0, 1); rTone(c, o, 0, 'sine', 70, 35, .22, .9); }],
  horn:   [.95, 1, (c, o) => { rTone(c, o, 0, 'sawtooth', 196, 196, .07, .8, 900); rTone(c, o, .02, 'sawtooth', 294, 294, .05, .8, 900); }],
  coin:   [.2, 1, (c, o) => rTone(c, o, 0, 'sine', 1320, 1760, .05, .12)],
  tap:    [.12, 1, (c, o) => rTone(c, o, 0, 'triangle', 620, 480, .04, .06)],
  fire:   [.36, 2, (c, o) => rNoise(c, o, 0, .32, 'bandpass', 900, .07, .22, .8)],
  magic:  [.4, 2, (c, o) => { rTone(c, o, 0, 'sine', 900, 300, .06, .3); rNoise(c, o, 0, .32, 'bandpass', 3000, .02, .25, 1); }],
  towerShot: [.25, 3, (c, o) => { rTone(c, o, 0, 'triangle', 250 + Math.random() * 30, 90, .045, .1); rTone(c, o, 0, 'sine', 140, 70, .03, .07); rNoise(c, o, .012, .14, 'bandpass', 1100, .014, .1, 1.5); }],
  heal:   [.4, 1, (c, o) => { rTone(c, o, 0, 'sine', 660, 990, .03, .25); rTone(c, o, .08, 'sine', 990, 1320, .02, .2); }]
};
function renderAll(){
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; if (!OAC) return;
  const sr = AC.sampleRate;
  for (const n in RECIPES){
    const [dur, variants, fn] = RECIPES[n]; SND[n] = [];
    for (let v = 0; v < variants; v++){
      try {
        const oc = new OAC(1, Math.ceil(sr * dur), sr); fn(oc, oc.destination);
        const done = b => SND[n].push(b), pr = oc.startRendering();
        if (pr && pr.then) pr.then(done); else oc.oncomplete = e => done(e.renderedBuffer);
      } catch(e){}
    }
  }
}
function audio(){
  if (!AC){ const A = window.AudioContext || window.webkitAudioContext;
    if (A){ try {
      AC = new A();
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 9000;
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 6; comp.attack.value = .003; comp.release.value = .15;
      OUT = AC.createGain(); OUT.gain.value = .9; OUT.connect(lp); lp.connect(comp); comp.connect(AC.destination);
      renderAll();
    } catch(e){ AC = null; } } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function sfx(n){
  if (muted || !AC || !OUT) return; const t = AC.currentTime;
  if (lastS[n] && t - lastS[n] < (GAP[n] || .05)) return;
  const list = SND[n]; if (!list || !list.length) return;
  if ((VOICES[n] || 0) >= (LIMIT[n] || 3)) return;
  lastS[n] = t;
  try {
    const src = AC.createBufferSource(); src.buffer = list[Math.floor(Math.random() * list.length)];
    src.playbackRate.value = .95 + Math.random() * .1; src.connect(OUT);
    VOICES[n] = (VOICES[n] || 0) + 1; src.onended = () => { VOICES[n]--; }; src.start(t + .005);
  } catch(e){}
}

/* ---------- State ---------- */
let G, UID = 1;
const cam = { x: 0, manualUntil: 0 };
function mkB(side, kind){
  const t = kind === 'tower', off = t ? TOWER_OFF : 130;
  return { isB:true, side, kind, x: side === 0 ? off : W - off, y: MIDY, r: t ? TOWER.r : CASTLE.r,
    hp: t ? TOWER.hp : CASTLE.hp, max: t ? TOWER.hp : CASTLE.hp, cd: 0, dead:false, shake:0, rubble:null, engaged:0 };
}
function newGame(){
  G = { phase:'title', round:0, gold:[0,0], bonus:[0,0], lastBonus:[0,0], units:[], proj:[], fx:[], parts:[], corpses:[], decals:[],
    bld:[mkB(0,'castle'), mkB(0,'tower'), mkB(1,'tower'), mkB(1,'castle')],
    spawnQ:[[],[]], spawnCd:[0,0], battleT:0, winner:null, endT:0, betweenT:0, shopP:0, cart:[], time:0, elapsed:0,
    stats:[0,1].map(() => ({ bought:{}, spent:0, kills:0, lost:0, killsBy:{}, bldDmg:0, healed:0, towerAt:0 })) };
}
const towerOf = s => G.bld.find(b => b.side === s && b.kind === 'tower');
const castleOf = s => G.bld.find(b => b.side === s && b.kind === 'castle');
const attackable = b => !b.dead && (b.kind === 'tower' || towerOf(b.side).dead);
const valid = t => !!t && (t.isB ? attackable(t) : t.hp > 0);
const edge = (a,b) => Math.hypot(a.x - b.x, a.y - b.y) - a.r - b.r;
const aimY = t => t.y - (t.isB ? 30 : t.fly ? UT.dragon.alt : 12);
const objective = side => { const t = towerOf(1 - side); return t.dead ? castleOf(1 - side) : t; };

/* ---------- Simulation ---------- */
function spawnUnit(side, type){
  const s = UT[type], tw = towerOf(side), c = castleOf(side), dir = side === 0 ? 1 : -1;
  const u = { id: UID++, side, type, x: c.x + dir * (c.r + 16 + Math.random() * 10), y: c.y + (Math.random() * 2 - 1) * 70,
    r: s.r, hp: s.hp, max: s.hp, cd: Math.random() * .4, retarget: 0, tgt: null, anim: Math.random() * 5, swing: 0, fire: 0,
    wheel: 0, cast: 0, fly: !!s.fly, face: dir, moving: false, inRange: false, engaged: 0, spread: (Math.random() * 2 - 1) * 110 };
  G.units.push(u);
  for (let i = 0; i < 6; i++) G.parts.push({ k:'smoke', x:u.x+(Math.random()-.5)*14, y:u.y-2, vx:(Math.random()-.5)*20, vy:-8-Math.random()*8, life:0, max:.7, size:4, col:'180,160,120' });
}
function pickTarget(u){
  const s = UT[u.type]; let best = null, bs = Infinity;
  for (const e of G.units){
    if (e.side === u.side || e.hp <= 0) continue; if (e.fly && !AIR.has(u.type)) continue; const d = edge(u, e);
    if (d > s.sight || (s.minRange && d < s.minRange)) continue;
    const sc = d + (u.type === 'catapult' ? 40 : 0); if (sc < bs){ bs = sc; best = e; }
  }
  for (const b of G.bld){
    if (b.side === u.side || !attackable(b)) continue; const d = edge(u, b); if (d > s.sight) continue;
    const sc = d + (u.type === 'dragon' ? -60 : u.type === 'catapult' || u.type === 'barrel' ? -160 : 40); if (sc < bs){ bs = sc; best = b; }
  }
  return best;
}
let SRC = null;
function hurt(e, a){
  const src = SRC, st = src && G.stats ? G.stats[src.side] : null;
  if (e.isB){
    if (!attackable(e)) return; if (st) st.bldDmg += Math.min(a, e.hp); e.hp -= a; e.shake = .25; e.engaged = 1.5;
    for (let i = 0; i < 2; i++) G.parts.push({ k:'debris', x:e.x+(Math.random()-.5)*e.r, y:e.y-10-Math.random()*40, vx:(Math.random()-.5)*60, vy:-30-Math.random()*40, g:260, life:0, max:.6, size:2, col:'#a99f86' });
    if (e.hp <= 0){ e.hp = 0; destroyB(e); }
  } else {
    if (e.hp <= 0) return; e.hp -= a; e.engaged = 1.5;
    for (let i = 0; i < 2; i++) G.parts.push({ k:'spark', x:e.x, y:e.y-14, vx:(Math.random()-.5)*70, vy:-20-Math.random()*40, g:200, life:0, max:.3, size:1.4, col:'#ffe6a0' });
    if (e.hp <= 0){ e.hp = 0;
      if (st){
        if (src.side !== e.side){ st.kills++; st.killsBy[src.type] = (st.killsBy[src.type] || 0) + 1; }
      } }
  }
}
function blast(x, y, rad, dmg, bldMult, side, big, air, kind){
  for (const e of G.units){ if (e.side === side || e.hp <= 0 || (e.fly && !air)) continue; const d = Math.hypot(e.x - x, e.y - y) - e.r; if (d < rad) hurt(e, dmg * (1 - .5 * Math.max(0, d) / rad)); }
  for (const b of G.bld){ if (b.side === side || !attackable(b)) continue; const d = Math.hypot(b.x - x, b.y - y) - b.r; if (d < rad) hurt(b, dmg * bldMult); }
  G.fx.push({ k:'boom', x, y, t:0, dur: big ? .6 : .4, r: big ? rad : rad * .7, magic: kind === 'magic' });
  if (kind === 'magic'){ for (let i = 0; i < 12; i++){ const a = Math.random() * 6.283; G.parts.push({ k:'spark', x, y:y-8, vx:Math.cos(a)*80, vy:Math.sin(a)*50-30, g:60, life:0, max:.6, size:2, col:'#d9c2ff' }); } sfx('magic'); return; }
  G.decals.push({ x, y, r: big ? rad * .55 : rad * .35, t:0 }); if (G.decals.length > 70) G.decals.shift();
  const n = big ? 16 : 8;
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.283, sp = 30 + Math.random() * (big ? 120 : 60);
    G.parts.push({ k:'debris', x, y:y-4, vx:Math.cos(a)*sp, vy:-60-Math.random()*(big?140:70), g:320, life:0, max:.8, size:1.5+Math.random()*2, col: big ? '#5a4632' : '#8e8878' });
    G.parts.push({ k:'smoke', x:x+(Math.random()-.5)*rad*.6, y:y-6, vx:(Math.random()-.5)*30, vy:-15-Math.random()*20, life:0, max:1.2+Math.random(), size: big ? 9 : 6, col:'70,64,56' });
  }
  sfx(big ? 'boom' : 'thunk');
}
function makeRubble(b){
  const R = rng(b.x | 0), n = b.kind === 'castle' ? 30 : 14, sz = b.kind === 'castle' ? 72 : 30, arr = [];
  const cols = ['#9d937c','#b8ae95','#7d7462','#8a8069'];
  for (let i = 0; i < n; i++){ const a = R() * 6.283, d = R() * sz; arr.push({ x:Math.cos(a)*d, y:Math.sin(a)*d*.45, w:4+R()*10, h:3+R()*7, rot:R()*3, c:cols[i%4] }); }
  return arr.sort((p,q) => p.y - q.y);
}
function destroyB(b){
  b.dead = true; b.rubble = makeRubble(b); sfx('crumble');
  const big = b.kind === 'castle';

/* ---------- Camera & sizing ---------- */
let VIEW = { s:1, ox:0, oy:0 };
let cssW = 0, cssH = 0, dpr = 1, scale = 1, offY = 0, portrait = false;
function resize(){
  cssW = window.innerWidth; cssH = window.innerHeight; dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr); cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';

}

    for (const b of G.bld) if (!b.dead && b.lastAtk != null && G.time - b.lastAtk < 1.5) xs.push(b.x);

        const d = Math.abs(front - castleOf(side).x);

const ST = { light:'#d6ccb2', base:'#b1a78e', dark:'#786f5c', line:'rgba(60,50,35,.3)' };

  else if (G.phase === 'between'){ G.betweenT -= dt; if (G.betweenT <= 0){ G.phase = 'turn'; startRound(); } }
  else if (G.phase === 'over') stepFx(dt);
  cam.shake = Math.max(0, (cam.shake || 0) - dt); updCam(dt, now); render(now);
  if (G.phase !== 'title'){ hud(); drawMini(); }
  requestAnimationFrame(frame);
}

resize(); makeTerrain(); titleScreen();
requestAnimationFrame(frame);
})();
</script>
