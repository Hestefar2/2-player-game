<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Banners of War">
<meta name="theme-color" content="#1f2a12">
<title>Banners of War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#efe0bb; --parch2:#dcc690; --ink:#2b1d0e; --ink2:#5d4526; --edge:#6a4a22; --gold:#a8761a;
  --btn:#7e2618; --btnInk:#fff3d6; --shade:rgba(24,16,7,.74); --hudInk:#f4e8cc;
  --head:'Cinzel','Palatino Linotype','Book Antiqua',Georgia,serif;
  --body:'Alegreya Sans','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --parch:#e4d3a9; --parch2:#cdb57e; --shade:rgba(14,9,4,.8); }
}
:root[data-theme="dark"]{ --parch:#e4d3a9; --parch2:#cdb57e; --shade:rgba(14,9,4,.8); }
*,*::before,*::after{box-sizing:inherit}
html{touch-action:manipulation;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:#1f2a12;color:var(--ink);font-family:var(--body);overflow:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;left:0;top:0;display:block;touch-action:none}
button{font-family:inherit}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:none;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);pointer-events:none}
#hud.on{display:flex}
.pside{width:24vw;min-width:124px;max-width:230px;background:var(--shade);border:1px solid rgba(240,224,187,.22);border-radius:8px;padding:5px 9px 6px;color:var(--hudInk)}
.pname{font-family:var(--head);font-weight:800;font-size:12px;letter-spacing:.04em;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.pside.r .pname{justify-content:flex-end}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
.bar{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:2px}
.pside.r .bar{flex-direction:row-reverse}
.bar span{width:40px;opacity:.85}
.pside.r .bar span{text-align:right}
.track{flex:1;height:7px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden;display:flex}
.pside.r .track{justify-content:flex-end}
.track i{display:block;height:100%;width:100%;background:var(--c)}
.track.locked i{opacity:.4;background:repeating-linear-gradient(135deg,var(--c) 0 4px,rgba(255,255,255,.35) 4px 6px)}
.mid{flex:1;max-width:38vw;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto}
.clocks{display:flex;gap:6px}
.timer{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{color:#ffcf6b}
.clock{font-family:var(--head);font-weight:800;font-size:13px;color:var(--hudInk);background:var(--shade);border-radius:8px;padding:3px 12px;white-space:nowrap}
#mini{width:100%;height:24px;border-radius:5px;border:1px solid rgba(240,224,187,.4);touch-action:none;display:block}
body.battling #hud{top:auto;bottom:0;align-items:flex-end;
  padding:0 calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 10px)}
body.battling .mid{flex-direction:column-reverse}

/* Shop */
#shop{position:fixed;left:0;right:0;bottom:0;z-index:7;display:none;
  padding:0 calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 10px)}
#shop.on{display:block}
#shop{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#shop.collapsed{transform:translateY(calc(100% - 30px - env(safe-area-inset-bottom,0px)))}
#shopTab{display:flex;align-items:center;gap:7px;margin:0 auto -2px;position:relative;z-index:1;height:28px;padding:0 16px;
  border:2px solid var(--edge);border-bottom:none;border-radius:10px 10px 0 0;background:linear-gradient(var(--parch),var(--parch2));
  font-family:var(--head);font-weight:800;font-size:12px;color:var(--ink);cursor:pointer;touch-action:manipulation;box-shadow:0 -3px 10px rgba(0,0,0,.3)}
#shopTab .arw{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--ink2);transition:transform .3s}
#shop.collapsed #shopTab .arw{transform:rotate(180deg)}
#shop.collapsed #shopTab{box-shadow:0 -3px 12px rgba(0,0,0,.45),0 0 0 2px rgba(242,193,78,.5)}
.shopbox{background:linear-gradient(var(--parch),var(--parch2));border:2px solid var(--edge);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.35);
  padding:9px 10px;display:flex;gap:10px;align-items:stretch}
.shopinfo{display:flex;flex-direction:column;justify-content:center;min-width:112px;max-width:150px}
.who{font-family:var(--head);font-weight:800;font-size:14px;color:var(--c);line-height:1.15}
.goldline{font-weight:800;font-size:22px;display:flex;align-items:center;gap:6px;margin:2px 0}
.coins{width:1.05em;height:1.05em;flex:none;vertical-align:-.18em}
.hint{font-size:11.5px;color:var(--ink2);line-height:1.25}
.cards{display:flex;gap:9px;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;padding:10px 10px 4px;margin:-10px -4px -4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.grp{flex:none;display:flex;flex-direction:column;gap:2px}
.grp + .grp{border-left:1.5px dashed rgba(106,74,34,.35);padding-left:10px}
.grp h4{margin:0;font-family:var(--head);font-weight:800;font-size:11px;letter-spacing:.03em;color:var(--ink2)}
.grp.lg h4{color:#8a5a08}
.grp.lg.locked h4{color:var(--ink2)}
.grp.lg.locked .card{filter:grayscale(1);opacity:.5;box-shadow:none;border-style:dashed;cursor:not-allowed}
.ct{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%;flex:1}
#playBtn.legend{background:linear-gradient(#ffe38a,#e9b331 60%,#c98d18);color:#3a2404;
  border:3px double #7a4f08;box-shadow:0 0 0 2px #fff1b8,0 0 18px rgba(255,200,60,.85),inset 0 -3px 0 rgba(120,70,0,.3)}
#playBtn.legend .tri{border-left-color:#3a2404}
.grp .row{display:flex;gap:9px;padding-top:8px}
.card.leg{border:2px solid #b8862a;background:linear-gradient(#fff4d2,#f1d78e);box-shadow:inset 0 0 0 2px #fff6d8,inset 0 0 0 3px #b8862a,0 0 10px rgba(242,190,60,.75)}
.card.leg .cn{color:#6b3f06}
.card.met{border-color:#8a2a14;background:linear-gradient(rgba(255,236,220,.6),rgba(240,190,160,.45))}
.legnote{font-family:var(--head);font-weight:800;color:#8a5a08;margin:-4px 0 12px;text-shadow:0 0 8px rgba(255,210,90,.8)}
#placeBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:7;display:none;align-items:center;gap:12px;
  background:linear-gradient(var(--parch),var(--parch2));border:2px solid #8a2a14;border-radius:12px;padding:8px 10px 8px 14px;box-shadow:0 6px 24px rgba(0,0,0,.55);font-weight:700;max-width:calc(100vw - 24px)}
#placeBar.on{display:flex}
.card{position:relative;flex:0 0 100px;min-width:0;border:1.5px solid var(--edge);border-radius:9px;background:rgba(255,250,235,.42);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 3px 6px;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.card:active{transform:scale(.96)}
.card.dis{opacity:.42}
.card.no{animation:no .25s}
@keyframes no{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card canvas{width:50px;height:42px;display:block}
.cn{font-family:var(--head);font-weight:600;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cd{font-size:10.5px;line-height:1.2;color:var(--ink2);text-align:center;margin:1px 0 3px}
.cc{margin-top:auto;display:flex;align-items:center;gap:3px;font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap}
.cnt{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--c);color:#fff;font-weight:800;font-size:13px;
  display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.minus{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:13px;border:1.5px solid var(--edge);background:var(--parch);
  font-weight:800;font-size:16px;line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
.z{display:none!important}
.shopbtns{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:104px}
.metwrap{position:relative}
.metbtn{width:100%;display:flex;align-items:center;gap:5px;border:1.5px solid #5e1a0c;border-radius:9px;padding:3px 9px 3px 4px;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(#3a1a12,#6e2412);color:#ffd9a8;font-family:var(--head);font-weight:800;font-size:12px;box-shadow:0 0 8px rgba(255,120,40,.35),inset 0 1px 0 rgba(255,200,150,.2)}
.metbtn:active{transform:scale(.97)}
.metbtn canvas{width:30px;height:25px;flex:none}
.metbtn .mt{flex:1;text-align:left;display:flex;flex-direction:column;line-height:1.1}
.metbtn small{font-family:var(--body);font-weight:500;font-size:10px;color:#f3c9a0}
.metbtn b{color:#ffc34d;font-family:var(--body);font-size:13px;display:flex;align-items:center;gap:3px}
.metbtn.dis{opacity:.42}
.metbtn.no{animation:no .25s}
.metwrap .cnt{background:#b8401a}
.minus.x{font-size:17px;background:#fff3e6;border-color:#8a2a14;color:#8a2a14}
.metbtn.done{opacity:.85;box-shadow:0 0 0 2px #ffc34d,0 0 10px rgba(255,160,60,.5)}
.btn{font-family:var(--head);font-weight:800;border:none;border-radius:9px;background:var(--btn);color:var(--btnInk);padding:11px 16px;font-size:14px;letter-spacing:.03em;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.card:focus-visible,.minus:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink2);box-shadow:none;border:1.5px solid var(--edge);padding:7px 10px;font-size:12px}

/* Screens */
#screen{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(20,14,6,.45),rgba(10,7,3,.86));
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 16px)}
#screen.on{display:flex}
.panel{background:linear-gradient(var(--parch),var(--parch2));border:2px solid var(--edge);border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.35);padding:16px 24px 18px;max-width:660px;width:100%;max-height:100%;overflow:auto;text-align:center}
.panel h1{font-family:var(--head);font-weight:800;margin:0 0 4px;font-size:clamp(24px,5vh,34px);line-height:1.1;letter-spacing:.02em}
.panel .sub{color:var(--ink2);margin:0 auto 10px;font-size:15px;line-height:1.35;max-width:52ch}
.panel .rnd{font-family:var(--head);font-weight:600;color:var(--ink2);font-size:14px;margin-bottom:2px}
.units{display:flex;justify-content:center;gap:14px;margin:6px 0 12px;flex-wrap:wrap}
.units div{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink2)}
.units canvas{width:50px;height:42px}
.units b{font-family:var(--head);color:var(--ink);font-size:12px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;text-align:left;font-size:13.5px;line-height:1.35;margin:4px 0 10px}
.rules p{margin:0}
.big{font-size:17px;padding:13px 26px}
.tiny{font-size:12px;color:var(--ink2);margin:10px 0 0}
.goldbig{font-size:20px;font-weight:800;margin:4px 0 12px;display:flex;justify-content:center;align-items:center;gap:8px}
.goldbig small{font-size:13px;font-weight:700;color:var(--ink2)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

#ready{position:relative;overflow:hidden;-webkit-touch-callout:none;touch-action:none}
#ready .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,215,110,.55);pointer-events:none}
#ready.holding .fill{width:100%;transition:width 1s linear}
#ready .lbl{position:relative}
#playBtn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18%);transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:12px;
  font-size:20px;padding:16px 30px 16px 24px;border-radius:40px;animation:pulse 1.6s ease-in-out infinite}
#playBtn.on{display:flex}
#playBtn .tri{width:0;height:0;border-left:16px solid var(--btnInk);border-top:10px solid transparent;border-bottom:10px solid transparent}
@keyframes pulse{0%,100%{box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),0 0 0 0 rgba(242,193,78,.6)}50%{box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),0 0 0 12px rgba(242,193,78,0)}}
@media (prefers-reduced-motion:reduce){#playBtn{animation:none}}
.statwrap{overflow-x:auto;margin:0 auto 12px;max-width:520px}
.stats{width:100%;border-collapse:collapse;font-size:13.5px;text-align:center}
.stats th,.stats td{padding:4px 8px;border-bottom:1px solid rgba(106,74,34,.22)}
.stats thead th{font-family:var(--head);font-weight:800;font-size:13px;border-bottom:2px solid rgba(106,74,34,.45)}
.stats tbody th{text-align:left;font-weight:700;color:var(--ink2)}
.stats td{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats td.best{color:#8a5a08;background:rgba(242,193,78,.28)}
#banner{position:fixed;left:50%;top:44%;z-index:8;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;color:#fff6de;
  text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px rgba(0,0,0,.6)}
#banner.show{animation:bn 2.8s ease forwards}
#banner .bt{font-family:var(--head);font-weight:800;font-size:clamp(26px,7vh,44px);white-space:nowrap}
#banner .bs{font-size:15px;font-weight:700;margin-top:2px}
#banner.gold.show{animation-duration:3.6s}
#banner.gold .bt{font-size:clamp(28.6px,7.7vh,48.4px)}
#banner.gold .bs{font-size:16.5px}
#banner .gamt{color:#ffd772;white-space:nowrap}
#banner .gamt .coins{width:1.15em;height:1.15em;vertical-align:-.22em;margin-right:3px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-38%) scale(.94)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0}}

#rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1b1610;color:var(--hudInk);text-align:center;padding:24px}
#rotate h2{font-family:var(--head);margin:0;font-size:22px}
#rotate p{margin:0;opacity:.8}
.phone{width:44px;height:74px;border:3px solid var(--hudInk);border-radius:9px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){
  .pside{width:31vw;min-width:0;padding:4px 7px 5px}
  .pname{font-size:11px}
  .bar{font-size:10px;gap:4px}
  .bar span{width:34px}
  .mid{max-width:32vw}
  .clock{font-size:12px;padding:3px 8px}
  .shopbox{flex-direction:column;gap:12px;padding:12px}
  .shopinfo{max-width:none;flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:12px}
  .shopinfo .hint{flex-basis:100%}
  .shopbox{max-height:calc(100vh - 96px);overflow-y:auto}
  .cards{display:flex;flex-direction:column;gap:6px;overflow:visible;max-height:none;padding:8px 6px 2px;margin:-8px -6px -2px}
  .grp + .grp{border-left:none;padding-left:0;border-top:1.5px dashed rgba(106,74,34,.35);padding-top:6px}
  .grp .row{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-top:5px}
  .grp h4{font-size:11px}
  .card{flex:none;flex-direction:row;justify-content:flex-start;align-items:center;gap:6px;padding:5px 8px 5px 4px;min-height:52px}
  .card canvas{width:40px;height:34px;flex:none}
  .ct{align-items:flex-start}
  .cn{font-size:12.5px}
  .cd{font-size:10.5px;text-align:left;margin:0;line-height:1.2}
  .cc{margin-top:2px;font-size:12px}
  .shopbtns{flex-direction:row-reverse;flex-wrap:wrap}
  .metwrap{order:-1;flex-basis:100%}
  .metbtn{padding:6px 12px 6px 8px;font-size:14px}
  .shopbtns .btn{flex:1}
  .shopbtns .btn.ghost{flex:0 0 auto;padding:11px 16px}
  .rules{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.phone{animation:none;transform:rotate(-90deg)}#banner.show{animation-duration:2.8s}}
 @media (orientation:landscape) and (max-height:500px){
  #hud{gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 4px)}
  .pside{width:21vw;min-width:0;max-width:190px;padding:3px 7px 4px;border-radius:7px}
  .pname{font-size:10px;margin-bottom:0;gap:5px}
  .dot{width:7px;height:7px}
  .bar{font-size:9.5px;margin-top:1px;gap:4px}
  .bar span{width:30px}
  .track{height:5px}
  .mid{max-width:32vw;gap:3px}
  .clocks{gap:4px}
  .clock{font-size:11px;padding:2px 8px;border-radius:6px}
  .timer{min-width:46px}
  #mini{height:17px}
  body.battling #hud{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 3px)}
  #shop{padding:0}
  body.barmode #hud{display:none}
  .shopbox{display:grid;grid-template-columns:128px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:10px;row-gap:6px;
    padding:7px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 12px);
    border-radius:0;border-left:none;border-right:none;border-bottom:none;box-shadow:0 -4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4)}
  .shopinfo{grid-column:1;grid-row:1;min-width:0;max-width:none}
  .shopinfo .hint{display:none}
  .who{font-size:12px}
  .goldline{font-size:18px;margin:0}
  .shopbtns{grid-column:1;grid-row:2;min-width:0;gap:5px;justify-content:flex-start}
  .shopbtns .btn{padding:7px 10px;font-size:13px}
  .shopbtns .btn.ghost{padding:4px 8px;font-size:11px}
  .metbtn{padding:2px 7px 2px 3px}
  .metbtn canvas{width:24px;height:20px}
  .metbtn small{display:none}
  .cards{grid-column:2;grid-row:1 / span 2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:10px;row-gap:3px;
    overflow:visible;padding:0;margin:0;align-content:start}
  .grp{min-width:0}
  .grp.bs,.grp.sp{grid-column:span 2}
  .grp.lg{grid-column:span 4}
  .grp + .grp{border-left:none;padding-left:0}
  .grp.sp{border-left:1.5px dashed rgba(106,74,34,.35);padding-left:9px;margin-left:-5px}
  .grp h4{font-size:10px}
  .grp .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding-top:4px}

function barView(){

  const top = (safeProbe.getBoundingClientRect().top || 0) + 2, avail = st - top;
  const y0 = GT - 30, y1 = GB + 10, s = clamp(avail / (y1 - y0), scale * .5, scale), vw = cssW / s;
  cam.x = vw >= W ? (W - vw) / 2 : clamp(cam.x, 0, W - vw);
  return { s, ox:-cam.x * s, oy:top + (avail - (y1 - y0) * s) / 2 - y0 * s, vw };
}
function render(now){

  const ab = barView();
  document.body.classList.toggle('barmode', !!ab);
  VIEW = ab ? ab : { s:scale, ox:(-cam.x + shx) * scale, oy:offY + lift + shy * scale };
  ctx.setTransform(VIEW.s * dpr, 0, 0, VIEW.s * dpr, VIEW.ox * dpr, VIEW.oy * dpr);
  if (forestTile) for (let x = 0; x < W; x += FTW){ ctx.drawImage(forestTile, x, -FTH, FTW, FTH); ctx.drawImage(forestTile, x, H + TB - 2, FTW, FTH); }

    gr.addColorStop(0, 'rgba(255,250,220,1)'); gr.addColorStop(.35, 'rgba(255,190,70,.95)'); gr.addColorStop(.7, 'rgba(210,80,20,.6)'); gr.addColorStop(1, 'rgba(120,30,0,0)');
    if (f.magic){ const mg = ctx.createRadialGradient(f.x, f.y - r * .3, 0, f.x, f.y - r * .3, r); mg.addColorStop(0, 'rgba(255,255,255,1)'); mg.addColorStop(.4, 'rgba(200,160,255,.9)'); mg.addColorStop(1, 'rgba(90,40,180,0)'); ctx.fillStyle = mg; }

function drawTarget(g, m, now){

  g.fillStyle = 'rgba(220,50,20,.14)'; g.beginPath(); g.ellipse(m.x, m.y, r, r * .45, 0, 0, Math.PI * 2); g.fill();

}
function drawMeteor(g, m){

function drawMini(){

  showScreen(`<div class="panel">
    <h1>Banners of War</h1>
    <p class="sub">Two players, one phone. Buy troops in secret, pass the phone, then watch the battle play out together.</p>
    <div class="rules">
      <p>Income starts at 20 gold and grows by 2 every round. Player 1 (blue, left) buys first, then hands over to Player 2 (red, right).</p>
      <p>Then 20 seconds of battle play out on their own. Break the enemy tower to expose their castle, then destroy the castle to win.</p>
    </div>
    <div class="units">${['sword','archer','barrel','catapult'].map(t => `<div><canvas data-icon="${t}"></canvas><b>${UT[t].name}</b>${['barrel','catapult'].includes(t) ? 'Special, ' : 'Basic, '}${UT[t].cost} gold</div>`).join('')}</div>
    <button class="btn big" data-act="start">Start game</button>
    <p class="tiny">From round 5, legendary units join the barracks. Once per round you can call a meteor (25 gold) on any spot you choose. It strikes 15 seconds into the battle. Troops always march out from your castle. Losing your tower gives you 15 bonus gold, plus 1 more for every round played. To play full screen, tap Share in Safari, then Add to Home Screen.</p>
  </div>`);
  screen.querySelectorAll('canvas[data-icon]').forEach(c => iconCanvas(c, c.dataset.icon, 0));
}
function startRound(){
  G.round++;
  G.income = INCOME0 + INCOME_STEP * (G.round - 1);
  for (const s of [0,1]){ G.lastBonus[s] = G.bonus[s]; G.gold[s] += G.income + G.bonus[s]; G.bonus[s] = 0; }
  turnScreen(0);
}
function turnScreen(p){
  G.phase = 'turn'; G.turnP = p; const c = SIDES[p], o = SIDES[1 - p];
  const legend = G.round === 5 ? '<p class="legnote">Legendary units are now unlocked, from this round on!</p>' : G.round > 5 ? '<p class="legnote">Legendary units can be recruited.</p>' : '';
  const lead = p === 0
    ? `${o.name}, look away while ${c.tag} chooses troops.`
    : `Hand the phone to ${c.name}. ${o.name}, no peeking.`;
  showScreen(`<div class="panel" style="--c:${c.col}">
    <div class="rnd">Round ${G.round}</div>
    <h1 style="color:${c.col}">${c.name}, your turn</h1>
    <p class="sub">${lead}</p>
    ${legend}
    <button class="btn big" data-act="open" style="background:${c.dark}">Open the barracks</button>
  </div>`);
}
const costOf = t => t === 'meteor' ? METEOR.cost : UT[t].cost;
function cartCost(){ return G.cart.reduce((a, t) => a + UT[t].cost, 0) + G.meteorCart.length * METEOR.cost; }
const cardsEl = $('#cards');
const COINS = '<svg class="coins" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14v3a7 2.4 0 0 0 14 0v-3" fill="#c28a22" stroke="#6f4b0c" stroke-width=".8"/><ellipse cx="10" cy="14" rx="7" ry="2.4" fill="#f6ca58" stroke="#6f4b0c" stroke-width=".8"/><path d="M3 10v3a7 2.4 0 0 0 14 0v-3" fill="#c28a22" stroke="#6f4b0c" stroke-width=".8"/><ellipse cx="10" cy="10" rx="7" ry="2.4" fill="#f6ca58" stroke="#6f4b0c" stroke-width=".8"/><path d="M3 6v3a7 2.4 0 0 0 14 0v-3" fill="#c28a22" stroke="#6f4b0c" stroke-width=".8"/><ellipse cx="10" cy="6" rx="7" ry="2.4" fill="#f6ca58" stroke="#6f4b0c" stroke-width=".8"/></svg>';
const DESC = { sword:'Hold the front line', archer:'Bring down big units', catapult:'Smash clumped armies', barrel:'Blow up tight crowds',
  priest:'Heals the front line', knight:'Hard to stop, hits hard', wizard:'Burns groups from range', dragon:'Burns through crowds' };
const CARD = t => {
  const m = t === 'meteor', name = m ? 'Meteor' : UT[t].name, role = m ? 'strikes at 15s' : UT[t].role.toLowerCase();
  return `<div class="card${!m && UT[t].legend ? ' leg' : ''}${m ? ' met' : ''}" data-t="${t}" role="button" tabindex="0" aria-label="${m ? 'Buy a meteor' : 'Recruit ' + name} for ${costOf(t)} gold">
  <canvas></canvas><div class="ct"><div class="cn">${name}</div><div class="cd">${DESC[t]}</div><div class="cc">${COINS}${costOf(t)}</div></div>
  <div class="cnt z">0</div><button class="minus z" aria-label="Remove one ${name}">−</button></div>`;
};
const GROUPS = [['Basic', ['sword','archer'], ' bs'], ['Special', ['barrel','catapult'], ' sp'], ['Legendary', LEGENDS, ' lg']];
cardsEl.innerHTML = GROUPS.map(([name, list, cls]) => `<div class="grp${cls}"><h4>${name}</h4><div class="row">${list.map(CARD).join('')}</div></div>`).join('');
function openShop(p){
  setShopOpen(true);
  G.shopP = p; G.cart = []; G.meteorCart = []; hideScreen(); cardsEl.scrollLeft = 0; cardsEl.scrollTop = 0;
  shop.style.setProperty('--c', SIDES[p].col); $('#who').textContent = `${SIDES[p].name} (${SIDES[p].tag})`;
  cardsEl.querySelectorAll('.card').forEach(c => iconCanvas(c.querySelector('canvas'), c.dataset.t, p));
  iconCanvas($('#metIcon'), 'meteor', p);
  shop.classList.add('on'); document.body.classList.add('shopping'); renderShop();
  const own = castleOf(p); cam.x = own.x - viewW() / 2; clampCam(); cam.manualUntil = 0;
}
function renderShop(){
  const p = G.shopP, left = G.gold[p] - cartCost();
  $('#goldLeft').textContent = left;
  const legendRound = G.round >= 5;
  const lg = cardsEl.querySelector('.grp.lg'), next = Math.ceil(G.round / 5) * 5 || 5;
  lg.classList.toggle('locked', !legendRound);
  lg.querySelector('h4').textContent = legendRound ? 'Legendary' : 'Legendary: unlocks in round 5';
  cardsEl.querySelectorAll('.card').forEach(card => {
    const t = card.dataset.t, n = t === 'meteor' ? G.meteorCart.length : G.cart.filter(x => x === t).length;
    const cnt = card.querySelector('.cnt'); cnt.textContent = n; cnt.classList.toggle('z', !n); card.querySelector('.minus').classList.toggle('z', !n);
    card.classList.toggle('dis', costOf(t) > left);
  });
  const nm = G.meteorCart.length, mb = $('#meteorBtn');
  $('#metCnt').classList.toggle('z', !nm); $('#metMinus').classList.toggle('z', !nm);
  mb.classList.toggle('done', nm > 0); mb.classList.toggle('dis', !nm && METEOR.cost > left);
  mb.querySelector('.mn').textContent = nm ? 'Meteor aimed' : 'Meteor';
  mb.setAttribute('aria-label', nm ? 'Meteor aimed. Tap to re-aim it.' : 'Buy a meteor for 25 gold');
  const waiting = G.spawnQ[p].length;
  let hint = G.cart.length ? `${G.cart.length} troop${G.cart.length > 1 ? 's' : ''} will march out` : 'Tap a card to buy it. Unspent gold carries over.';
  if (nm) hint += `. ${nm} meteor${nm > 1 ? 's' : ''} ready`;
  if (waiting) hint += `. ${waiting} still waiting at the gate`;

  $('#shopHint').textContent = hint;
}
function setShopOpen(open){
  shop.classList.toggle('collapsed', !open); $('#shopTab').setAttribute('aria-expanded', open);
  $('#tabTxt').textContent = open ? 'Hide' : `Barracks (${G.gold[G.shopP] - cartCost()} gold)`;
}
function closeShop(){ setShopOpen(true); shop.classList.remove('on'); document.body.classList.remove('shopping'); }
function ready(){
  const p = G.shopP, st = G.stats[p]; st.spent += cartCost(); st.meteors += G.meteorCart.length;
  for (const t of G.cart) st.bought[t] = (st.bought[t] || 0) + 1;
  G.gold[p] -= cartCost(); G.spawnQ[p].push(...G.cart);
  G.meteorCart.forEach((m, i) => G.meteors.push({ x:m.x, y:m.y, side:p, at:METEOR.at + i * .35 + (p ? .15 : 0), landed:false }));
  G.cart = []; G.meteorCart = []; closeShop();
  if (p === 0) turnScreen(1); else readyToFight();
}
function readyToFight(){
  G.phase = 'prebattle'; cam.manualUntil = 0;
  const b = $('#playBtn'); b.classList.toggle('legend', G.round === 5); b.classList.add('on'); setTimeout(() => b.focus({ preventScroll:true }), 30);
}
function startBattle(){
  $('#playBtn').classList.remove('on');
  G.phase = 'battle'; G.battleT = BATTLE; G.elapsed = 0; cam.manualUntil = 0; banner('Battle!', ''); sfx('horn');
}
function statsTable(){
  const S = G.stats, nm = t => t === 'tower' ? 'Tower' : t === 'meteor' ? 'Meteor' : UT[t].name;
  const top = o => { let b = null; for (const k in o) if (!b || o[k] > o[b]) b = k; return b ? `${nm(b)} (${o[b]})` : 'None'; };
  const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
  const rows = [
    ['Gold spent', s => s.spent, 1],
    ['Units bought', s => sum(s.bought), 1],
    ['Most bought', s => top(s.bought), 0],
    ['Enemies killed', s => s.kills, 1],
    ['Units lost', s => s.lost, -1],
    ['Top killer', s => top(s.killsBy), 0],
    ['Damage to buildings', s => Math.round(s.bldDmg), 1],
    ['Enemy tower destroyed', s => s.towerRound ? `Round ${s.towerRound}` : 'No', 0],
    ['Meteors called', s => s.meteors, 0, true],
    ['Meteor kills', s => s.meteorKills, 1, true],
    ['Own troops hit by own meteor', s => s.friendly, -1, true],
    ['Health healed by priests', s => Math.round(s.healed), 1, true]
  ];
  const body = rows.map(([label, f, better, optional]) => {
    const a = f(S[0]), b = f(S[1]);
    if (optional && !a && !b) return '';
    const w = better && a !== b ? ((better > 0) === (a > b) ? 0 : 1) : -1;
    return `<tr><th>${label}</th><td class="${w === 0 ? 'best' : ''}">${a}</td><td class="${w === 1 ? 'best' : ''}">${b}</td></tr>`;
  }).join('');
  return `<div class="statwrap"><table class="stats"><thead><tr><th></th><th style="color:${SIDES[0].col}">${SIDES[0].name}</th><th style="color:${SIDES[1].col}">${SIDES[1].name}</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function overScreen(){
  G.phase = 'over'; const c = SIDES[G.winner], o = SIDES[1 - G.winner];
  showScreen(`<div class="panel">
    <div class="rnd">Round ${G.round}</div>
    <h1 style="color:${c.col}">${c.name} wins</h1>
    <p class="sub">The ${o.tag.toLowerCase()} castle has fallen. Long live the ${c.tag.toLowerCase()} banner.</p>
    ${statsTable()}
    <div class="row"><button class="btn big" data-act="again" style="background:${c.dark}">Play again</button><button class="btn ghost" data-act="title">Back to title</button></div>
  </div>`);
}

/* ---------- Input ---------- */
screen.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; audio(); sfx('tap');
  const a = b.dataset.act;
  if (a === 'start' || a === 'again'){ newGame(); hideScreen(); $('#hud').classList.add('on'); cam.x = 0; startRound(); }
  else if (a === 'open') openShop(G.turnP);
  else if (a === 'title') titleScreen();
});
cardsEl.addEventListener('click', e => {
  audio();
  const card = e.target.closest('.card'); if (!card) return; const t = card.dataset.t;
  if (e.target.closest('.minus')){
    if (t === 'meteor') G.meteorCart.pop(); else { const i = G.cart.lastIndexOf(t); if (i >= 0) G.cart.splice(i, 1); }
    renderShop(); return; }
  if (UT[t] && UT[t].legend && G.round < 5){ card.classList.remove('no'); void card.offsetWidth; card.classList.add('no'); return; }
  if (costOf(t) <= G.gold[G.shopP] - cartCost()){
    if (t === 'meteor'){ startPlacing(); return; }
    G.cart.push(t); renderShop(); }
  else { card.classList.remove('no'); void card.offsetWidth; card.classList.add('no'); }
});
cardsEl.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')){ e.preventDefault(); e.target.click(); } });
(() => {
  const rb = $('#ready'); let tm = null;
  const cancel = () => { clearTimeout(tm); tm = null; rb.classList.remove('holding'); };
  rb.addEventListener('pointerdown', e => { audio(); e.preventDefault(); cancel(); rb.classList.add('holding');
    tm = setTimeout(() => { cancel(); ready(); }, 1000); });
  ['pointerup','pointerleave','pointercancel'].forEach(n => rb.addEventListener(n, cancel));
  rb.addEventListener('contextmenu', e => e.preventDefault());
  rb.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat){ e.preventDefault(); ready(); } });
})();
$('#shopTab').addEventListener('click', () => { audio(); setShopOpen(shop.classList.contains('collapsed')); });
$('#meteorBtn').addEventListener('click', () => { audio(); const b = $('#meteorBtn');
  if (G.meteorCart.length){ G.prevMeteor = G.meteorCart; G.meteorCart = []; startPlacing(); return; }
  if (METEOR.cost <= G.gold[G.shopP] - cartCost()) startPlacing(); else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); } });
$('#metMinus').addEventListener('click', e => { e.stopPropagation(); G.meteorCart = []; renderShop(); });
$('#playBtn').addEventListener('click', () => { audio(); startBattle(); });
$('#clear').addEventListener('click', () => { G.cart = []; G.meteorCart = []; renderShop(); });
const placeBar = $('#placeBar');
function startPlacing(){ G.placing = true; shop.classList.remove('on'); placeBar.classList.add('on'); }
function stopPlacing(){ G.placing = false; G.prevMeteor = null; placeBar.classList.remove('on'); shop.classList.add('on'); setShopOpen(true); renderShop(); }
$('#cancelPlace').addEventListener('click', () => { if (G.prevMeteor) G.meteorCart = G.prevMeteor; stopPlacing(); });
function placeAt(e){
  const wx = (e.clientX - VIEW.ox) / VIEW.s, wy = (e.clientY - VIEW.oy) / VIEW.s;
  if (wy < GT - 30 || wy > H + 10 || wx < 0 || wx > W) return;
  G.meteorCart = [{ x:clamp(wx, 20, W - 20), y:clamp(wy, GT, GB) }]; stopPlacing();
}

let drag = null;
cv.addEventListener('pointerdown', e => { audio(); drag = { id:e.pointerId, x:e.clientX, y:e.clientY, cx:cam.x, moved:false }; });
const noPan = () => G.phase === 'title' || G.phase === 'battle' || G.phase === 'between' || G.phase === 'ending';
cv.addEventListener('pointermove', e => { if (!drag || drag.id !== e.pointerId || noPan()) return; if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) drag.moved = true; if (!drag.moved) return; cam.x = drag.cx - (e.clientX - drag.x) / VIEW.s; clampCam(); cam.manualUntil = performance.now() + 3000; });
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', e => { if (G.placing && drag && !drag.moved) placeAt(e);
  else if (drag && shop.classList.contains('on') && !shop.classList.contains('collapsed')) setShopOpen(false);
  endDrag(); }); cv.addEventListener('pointercancel', endDrag);
function miniJump(e){ if (noPan()) return; const r = mini.getBoundingClientRect(); cam.x = (e.clientX - r.left) / r.width * W - viewW() / 2; clampCam(); cam.manualUntil = performance.now() + 3000; }
let miniDown = false;
mini.addEventListener('pointerdown', e => { miniDown = true; miniJump(e); });
mini.addEventListener('pointermove', e => { if (miniDown) miniJump(e); });
window.addEventListener('pointerup', () => { miniDown = false; });
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('resize', () => { resize(); clampCam(); });

/* ---------- Loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  document.body.classList.toggle('battling', G.phase === 'battle' || G.phase === 'between' || G.phase === 'ending');
  if (G.phase === 'battle'){
    update(dt * SPEED);
    if (G.phase === 'battle'){
      G.battleT -= dt; G.elapsed = BATTLE - G.battleT;
      for (const m of G.meteors) if (!m.landed && G.elapsed >= m.at){ m.landed = true; m.landT = G.elapsed; meteorImpact(m); }
      if (G.battleT <= 0){ G.battleT = 0; G.meteors = G.meteors.filter(m => !m.landed); G.phase = 'between'; G.betweenT = 1.1; banner('Hold!', 'The battle pauses for new orders'); }
    }
  }
  else if (G.phase === 'ending'){ update(dt * SPEED); G.endT -= dt; if (G.endT <= 0) overScreen(); }
  else if (G.phase === 'between'){ G.betweenT -= dt; if (G.betweenT <= 0){ G.phase = 'turn'; startRound(); } }
  else if (G.phase === 'over') stepFx(dt);
  cam.shake = Math.max(0, (cam.shake || 0) - dt); updCam(dt, now); render(now);
  if (G.phase !== 'title'){ hud(); drawMini(); }
  requestAnimationFrame(frame);
}

resize(); makeTerrain(); titleScreen();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
